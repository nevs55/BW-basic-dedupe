name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check playwright
      - run: playwright install --with-deps chromium
      - name: Run the browser suite
        run: python3 tests/run-tests.py
